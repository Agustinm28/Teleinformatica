apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: public # Cambiar a nginx para Rancher
  name: mstream-ingress
spec:
  rules:
  #- host: # Aca cambiar host por dominio - UM -> amontana.my.kube.um.edu.ar
  - http:
      paths:
      - backend:
          service:
            name: mstream-service
            port:
              number: 3000
        path: /
        pathType: Prefix